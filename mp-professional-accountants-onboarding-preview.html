<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>M&P Professional Accountants — Preview</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f6f7fb;margin:0;padding:20px}
.card{max-width:900px;margin:auto;background:#fff;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.1);padding:24px}
h1{margin:0;color:#0b1c2d}
h2{margin-top:4px;color:#111}
.section{margin-top:22px;border-top:1px solid #e5e7eb;padding-top:16px}
label{display:block;font-weight:bold;margin-top:12px}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin-top:6px}
.badge{background:#0b1c2d;color:#fff;padding:6px 10px;border-radius:8px;font-weight:bold;display:inline-block}
.upload{margin-top:14px;padding:16px;border:2px dashed #aaa;border-radius:12px}
</style>
</head>
<body>
  <div class="card">
    <h1>M&P Professional Accountants</h1>
    <h2>Business Client Onboarding Form (Preview)</h2>

    <div class="section">
      <span class="badge">Section 1</span>
      <label>Legal Business Name</label>
      <input placeholder="ABC Holdings Inc.">
      <label>Business Structure</label>
      <input placeholder="Corporation">
      <label>Business Number (BN)</label>
      <input placeholder="123456789">
    </div>

    <div class="section">
      <span class="badge">Section 2</span>
      <label>Registered Business Address</label>
      <textarea placeholder="Street, City, Province"></textarea>
      <label>Business Email</label>
      <input placeholder="info@company.com">
    </div>

    <div class="section">
      <span class="badge">Section 3</span>
      <label>Owner / Director Name</label>
      <input placeholder="Full Name">
      <label>Personal Phone</label>
      <input placeholder="+1 000 000 0000">
    </div>

    <div class="section">
      <span class="badge">Documents</span>
      <div class="upload">
        Upload Articles of Incorporation, Financials, CRA notices (PDF, Word, Excel)
      </div>
    </div>
  </div>
</body>
</html>
